<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dark background -->
  <rect width="128" height="128" fill="#0A0A0A"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4D4D8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1D9E75;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1D9E75;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Subtle glow background -->
  <circle cx="64" cy="64" r="56" fill="url(#glowGradient)"/>
  
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- AI/Robot head icon (stylized) -->
  <g transform="translate(64, 64)">
    <!-- Main head shape -->
    <rect x="-24" y="-28" width="48" height="48" rx="6" fill="none" stroke="url(#accentGradient)" stroke-width="2.5"/>
    
    <!-- Left eye -->
    <rect x="-16" y="-14" width="10" height="10" rx="1.5" fill="none" stroke="url(#accentGradient)" stroke-width="2"/>
    <circle cx="-11" cy="-9" r="2.5" fill="#1D9E75"/>
    
    <!-- Right eye -->
    <rect x="6" y="-14" width="10" height="10" rx="1.5" fill="none" stroke="url(#accentGradient)" stroke-width="2"/>
    <circle cx="11" cy="-9" r="2.5" fill="#1D9E75"/>
    
    <!-- Mouth / circuit line -->
    <path d="M -12 4 L 12 4" stroke="url(#accentGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Circuit nodes on mouth -->
    <circle cx="-12" cy="4" r="1.5" fill="#1D9E75"/>
    <circle cx="0" cy="4" r="1.5" fill="#1D9E75"/>
    <circle cx="12" cy="4" r="1.5" fill="#1D9E75"/>
    
    <!-- Antenna / accountability symbol (dollar sign integrated) -->
    <path d="M 0 -28 L 0 -40" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-42" r="3" fill="#1D9E75"/>
    
    <!-- Stability base lines -->
    <line x1="-18" y1="18" x2="-8" y2="20" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.5"/>
    <line x1="8" y1="20" x2="18" y2="18" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Center accent ring (accountability badge) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.4" stroke-dasharray="4,6"/>
</svg>